<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/logo.png" type="image/png">
    <title>Tech Store | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <div class="global-noise"></div>
    <div class="login-container">
        <div class="cyber-card login-card">
            <div class="noise-overlay"></div>
            <div class="cyber-card-inner">
                <h1 class="login-title">ĐĂNG NHẬP</h1>
                <form id="login-form" class="login-form">
                    <div class="input-group">
                        <label for="username">Tên đăng nhập</label>
                        <input type="text" id="username" class="cyber-input" autocomplete="username" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" class="cyber-input" autocomplete="current-password"
                            required>
                    </div>
                    <div class="remember-group">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me">Ghi nhớ đăng nhập</label>
                    </div>
                    <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
                    <p id="login-error" class="login-error"></p>
                </form>
            </div>
        </div>
        <a href="index.html" class="back-link">← Quay lại cửa hàng</a>
    </div>
    <script src="js/auth.js"></script>
</body>

</html>
